# Cabeceras de seguridad. Se incluyen en el server y en cada location que define su propio add_header,
# porque en Nginx un add_header dentro de un location anula los heredados del server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Puerto serie solo para el propio sistema (primera instalación del ESP32); lo demás, bloqueado.
add_header Permissions-Policy "serial=(self), usb=(), camera=(), microphone=(), geolocation=()" always;
