# Nginx: único punto de entrada en la red local.
# - Puerto 443 (HTTPS, certificado propio de la institución): sistema web y API para los navegadores.
#   HTTPS es necesario para que el navegador permita la primera instalación del ESP32 por USB (Web Serial).
# - Puerto 80 (HTTP): solo para las estaciones ESP32 (envío de mediciones y actualización OTA);
#   un navegador que entra por http:// se redirige a https://.
# La API y PostgreSQL no se publican.

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    location /api/v1/iot/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    ssl_certificate /etc/nginx/certs/servidor.crt;
    ssl_certificate_key /etc/nginx/certs/servidor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;

    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Las respuestas de la API (datos personales, sesión) no se guardan en la caché del navegador.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location = /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /assets/ {
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas del frontend (React Router)
    location / {
        try_files $uri /index.html;
    }
}
