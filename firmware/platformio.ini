; Firmware de la estación IoT de atrapanieblas (ESP32 + Arduino).
; Las credenciales NO se compilan en el firmware: se cargan por puerto serie
; y se guardan en la memoria NVS del ESP32 (ver README.md).

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    adafruit/Adafruit SHT31 Library@2.2.2
    adafruit/Adafruit BMP280 Library@2.6.8
build_flags =
    -DCORE_DEBUG_LEVEL=1
