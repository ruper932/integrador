; Firmware de la estación IoT de atrapanieblas (ESP32 + Arduino).
; Las credenciales NO se compilan en el firmware: se cargan por puerto serie
; y se guardan en la memoria NVS del ESP32 (ver README.md).

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    finitespace/BME280@3.0.0
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
build_flags =
    -DCORE_DEBUG_LEVEL=1
upload_speed = 115200
