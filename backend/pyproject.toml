[project]
name = "atrapanieblas-backend"
version = "0.1.0"
description = "API local del sistema de monitoreo de agua captada mediante atrapanieblas"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    # Modelo de ML: misma versión de scikit-learn con la que se entrenó el artefacto (joblib no es portable entre versiones).
    "scikit-learn==1.9.1",
    "pandas>=2.2",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
